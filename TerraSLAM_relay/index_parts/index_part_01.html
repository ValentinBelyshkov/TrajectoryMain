<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraSLAM Control Panel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --orange: #ffa657;
  --cyan: #39d353;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
  font-size: 13px;
  min-height: 100vh;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--blue);
  letter-spacing: 0.5px;
}

.badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}

.badge-ok { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
.badge-warn { background: rgba(210,153,34,.15); color: var(--yellow); border: 1px solid rgba(210,153,34,.3); }
.badge-err { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.3); }

#gw-badge { margin-left: auto; }

.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  height: calc(100vh - 49px);
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-section { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 8px 6px 4px; }

.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  width: 100%;
  text-align: left;
  font-size: 13px;
  transition: background .15s;
}
.nav-btn:hover { background: var(--surface2); }
.nav-btn.active { background: rgba(88,166,255,.1); color: var(--blue); }
.nav-btn .icon { font-size: 15px; width: 20px; text-align: center; }

.main {
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel {
  display: none;
  flex-direction: column;
  gap: 16px;
}
.panel.active { display: flex; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.card-header {
  padding: 10px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
}

.card-body { padding: 14px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }

/* Buttons */
.btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-green { border-color: rgba(63,185,80,.4); color: var(--green); }
.btn-green:hover { background: rgba(63,185,80,.1); border-color: var(--green); color: var(--green); }
.btn-red { border-color: rgba(248,81,73,.4); color: var(--red); }
.btn-red:hover { background: rgba(248,81,73,.1); border-color: var(--red); color: var(--red); }
.btn-blue { border-color: rgba(88,166,255,.4); color: var(--blue); }
.btn-blue:hover { background: rgba(88,166,255,.1); border-color: var(--blue); color: var(--blue); }
.btn-orange { border-color: rgba(255,166,87,.4); color: var(--orange); }
.btn-orange:hover { background: rgba(255,166,87,.1); border-color: var(--orange); color: var(--orange); }
.btn-purple { border-color: rgba(188,140,255,.4); color: var(--purple); }
.btn-purple:hover { background: rgba(188,140,255,.1); border-color: var(--purple); color: var(--purple); }

.btn-lg { padding: 9px 20px; font-size: 13px; }
.btn-sm { padding: 3px 9px; font-size: 11px; }

/* Mode toggle */
.toggle-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.toggle-opt {
  flex: 1;
  padding: 6px 12px;
  background: var(--surface2);
  color: var(--muted);
  border: none;
  cursor: pointer;
  font-size: 12px;
  transition: all .2s;
  text-align: center;
}
.toggle-opt.active { background: rgba(88,166,255,.15); color: var(--blue); font-weight: 600; }
.toggle-opt:not(.active):hover { background: var(--border); }

/* Inputs */
input[type="text"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 10px;
  font-size: 12px;
  outline: none;
  flex: 1;
  min-width: 160px;
}
input[type="text"]:focus { border-color: var(--blue); }

/* Output area */
.output {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'JetBrains Mono', 'Fira Mono', monospace;
  font-size: 11px;
  line-height: 1.6;
  padding: 10px 12px;
  min-height: 60px;
  max-height: 260px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--cyan);
}
.output.err { color: var(--red); }

/* Component grid */
.comp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

.comp-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}

.comp-name {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 4px;
}

.comp-status {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-warn { background: var(--yellow); }
.dot-err { background: var(--red); }

.comp-actions { display: flex; gap: 5px; }

/* Slam state strip */
.slam-state {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.slam-kv { display: flex; flex-direction: column; gap: 1px; }
.slam-kv span:first-child { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.slam-kv span:last-child { font-weight: 600; }

/* Log area */
#log-output {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: 'JetBrains Mono', 'Fira Mono', monospace;
  font-size: 11px;
  line-height: 1.65;
  padding: 10px 12px;
  height: 460px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

.log-info { color: #58a6ff; }
.log-warn { color: #d29922; }
.log-error { color: #f85149; }
.log-debug { color: #8b949e; }
.log-line { display: block; }

/* Data display */
